<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2a2a2e"/>
      <stop offset="50%"  stop-color="#3c3c42"/>
      <stop offset="100%" stop-color="#1e1e22"/>
    </linearGradient>
    <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4a4a52"/>
      <stop offset="100%" stop-color="#28282e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <!-- Drop shadow group -->
  <g filter="url(#shadow)">

    <!-- Phone body -->
    <rect x="30" y="30" width="340" height="740" rx="44" ry="44"
          fill="url(#bodyGrad)" />

    <!-- Side highlight -->
    <rect x="30" y="30" width="6" height="740" rx="3"
          fill="url(#sideGrad)" opacity="0.6"/>

    <!-- Inner bezel -->
    <rect x="34" y="34" width="332" height="732" rx="42" ry="42"
          fill="none" stroke="#111" stroke-width="2"/>

    <!-- Screen area — perspective quad (slightly tilted for realism) -->
    <!-- This is the element the pipeline will warp into -->
    <!-- Points: TL(50,90) TR(352,85) BR(355,710) BL(47,715) -->
    <path id="screen"
          d="M 50,90 L 352,85 L 355,710 L 47,715 Z"
          fill="#0a0a14"/>

    <!-- Notch / Dynamic Island -->
    <rect x="155" y="42" width="90" height="26" rx="13"
          fill="#111"/>

    <!-- Front camera dot inside notch -->
    <circle cx="220" cy="55" r="5" fill="#1a1a1a"/>
    <circle cx="220" cy="55" r="2" fill="#222"/>

    <!-- Home indicator bar -->
    <rect x="160" y="738" width="80" height="4" rx="2"
          fill="rgba(255,255,255,0.25)"/>

    <!-- Volume buttons (left side) -->
    <rect x="24" y="210" width="6" height="50" rx="3" fill="#3a3a40"/>
    <rect x="24" y="275" width="6" height="50" rx="3" fill="#3a3a40"/>

    <!-- Power button (right side) -->
    <rect x="370" y="240" width="6" height="80" rx="3" fill="#3a3a40"/>

    <!-- Speaker grille (bottom) -->
    <rect x="170" y="756" width="4" height="8" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="180" y="756" width="4" height="8" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="190" y="756" width="4" height="8" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="200" y="756" width="4" height="8" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="210" y="756" width="4" height="8" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="220" y="756" width="4" height="8" rx="2" fill="rgba(255,255,255,0.12)"/>

    <!-- Screen glare overlay -->
    <path d="M 55,92 L 200,88 L 200,300 L 52,305 Z"
          fill="url(#glareGrad)" opacity="0.04"/>

  </g>

  <defs>
    <linearGradient id="glareGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer edge highlight -->
  <rect x="30" y="30" width="340" height="740" rx="44" ry="44"
        fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

</svg>

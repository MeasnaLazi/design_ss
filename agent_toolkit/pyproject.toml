[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-toolkit"
version = "0.1.0"
description = "Layout and image helpers for screenshot designer agents (parity with web_ui screenshot-designer-server)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "pillow>=10.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-toolkit = "agent_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bio — App Store strip</title>
<style>
  /* Theme from output/appstore.json: primary #0C0C0A (near-black) · secondary #F5F1EE (warm cream) */
  :root {
    --p: #0C0C0A;
    --s: #F5F1EE;
    --cream-hi: #FDFBF8;
    --cream-lo: #E7DECF;
    --ink-hi: #1B1814;
    --muted-on-cream: #6E6759;
    --muted-on-ink: #B9AF9C;
    --accent: #B6893C; /* warm brass — designer accent, complements cream/ink */
    --sans: -apple-system, 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif;
  }
  html, body { margin: 0; }
  .strip { display: flex; gap: 0; width: max-content; background: #2b2b2b; }
  .panel {
    position: relative; overflow: hidden;
    width: 1290px; height: 2796px;
    background: var(--s);
  }
  [data-role="title"] {
    font-family: var(--sans); font-weight: 800;
    font-size: 130px; line-height: 1.03; letter-spacing: -3px;
  }
  [data-role="subtitle"] {
    font-family: var(--sans); font-weight: 400;
    font-size: 56px; line-height: 1.3;
  }
  .rule { width: 168px; height: 8px; border-radius: 4px; background: var(--accent); }
  .shadow-lg { filter: drop-shadow(0 60px 90px rgba(12,12,10,0.28)); }
  .shadow-md { filter: drop-shadow(0 40px 65px rgba(12,12,10,0.24)); }
</style>
<script type="module" src="/composer/device-frames.mjs"></script>
</head>
<body>
<div class="strip">

  <!-- Panel 0 · Capture Your Story · hero, front pose, centered -->
  <section class="panel" data-panel="0"
       style="background: radial-gradient(130% 80% at 50% 0%, var(--cream-hi) 0%, var(--s) 45%, var(--cream-lo) 100%);">
    <div data-layer="decor" style="position:absolute; right:-300px; top:-320px; width:860px; height:860px;
         border-radius:50%; background: radial-gradient(circle, rgba(182,137,60,0.15), transparent 65%);"></div>
    <div data-layer="text" data-role="title" style="position:absolute; left:0; top:220px; width:1290px; text-align:center; color:var(--p);">
      Capture Your<br>Story
    </div>
    <div data-layer="decor" class="rule" style="position:absolute; left:561px; top:596px;"></div>
    <div data-layer="text" data-role="subtitle" style="position:absolute; left:190px; top:722px; width:910px; text-align:center; color:var(--muted-on-cream);">
      Every moment worth remembering
    </div>
    <div data-layer="device" data-device data-pack="iphone_12_pro" data-pose="front"
         data-screenshot="/datasource/screenshots/appstore_iphone_portrait/management.PNG.png"
         data-screen-fallback="#EDE6DA"
         class="shadow-lg"
         style="position:absolute; width:1030px; left:178px; top:1010px;"></div>
  </section>

  <!-- Panel 1 · Write in Seconds · isometric-left, cropped hard right so only the clean front+edge facet reads -->
  <section class="panel" data-panel="1"
       style="background: linear-gradient(165deg, var(--cream-hi) 0%, var(--s) 55%, var(--cream-lo) 100%);">
    <div data-layer="text" data-role="title" style="position:absolute; left:112px; top:150px; width:1050px; color:var(--p);">
      Write in<br>Seconds
    </div>
    <div data-layer="decor" class="rule" style="position:absolute; left:114px; top:558px;"></div>
    <div data-layer="text" data-role="subtitle" style="position:absolute; left:114px; top:684px; width:900px; color:var(--muted-on-cream);">
      Quick notes, zero friction
    </div>
    <div data-layer="device" data-device data-pack="iphone_12_pro" data-pose="angled-left"
         data-screenshot="/datasource/screenshots/appstore_iphone_portrait/form.jpeg"
         data-screen-fallback="#EDE6DA"
         class="shadow-md"
         style="position:absolute; width:820px; left:470px; top:850px;"></div>
  </section>

  <!-- Panel 2 · Just Speak It · isometric-right, mirrored, cropped hard left; sound-bar decor -->
  <section class="panel" data-panel="2"
       style="background: linear-gradient(195deg, var(--cream-hi) 0%, var(--s) 55%, var(--cream-lo) 100%);">
    <div data-layer="text" data-role="title" style="position:absolute; right:112px; top:150px; width:1050px; text-align:right; color:var(--p);">
      Just Speak It
    </div>
    <div data-layer="decor" class="rule" style="position:absolute; right:114px; top:558px;"></div>
    <div data-layer="text" data-role="subtitle" style="position:absolute; right:114px; top:684px; width:900px; text-align:right; color:var(--muted-on-cream);">
      Voice notes on the go
    </div>
    <div data-layer="decor" style="position:absolute; right:114px; top:830px; display:flex; align-items:flex-end; gap:14px; height:100px;">
      <div style="width:14px; height:36%; background:var(--accent); border-radius:8px; opacity:0.85;"></div>
      <div style="width:14px; height:70%; background:var(--accent); border-radius:8px; opacity:0.85;"></div>
      <div style="width:14px; height:100%; background:var(--accent); border-radius:8px; opacity:0.85;"></div>
      <div style="width:14px; height:52%; background:var(--accent); border-radius:8px; opacity:0.85;"></div>
      <div style="width:14px; height:82%; background:var(--accent); border-radius:8px; opacity:0.85;"></div>
      <div style="width:14px; height:44%; background:var(--accent); border-radius:8px; opacity:0.85;"></div>
    </div>
    <div data-layer="device" data-device data-pack="iphone_12_pro" data-pose="angled-right"
         data-screenshot="/datasource/screenshots/appstore_iphone_portrait/recording.PNG.png"
         data-screen-fallback="#EDE6DA"
         class="shadow-md"
         style="position:absolute; width:820px; left:0px; top:850px;"></div>
  </section>

  <!-- Panel 3 · Private By Design · dark inversion, no real screenshot available (deliberate blank screen) -->
  <section class="panel" data-panel="3"
       style="background: radial-gradient(130% 85% at 25% 100%, var(--ink-hi) 0%, var(--p) 60%);">
    <div data-layer="text" data-role="title" style="position:absolute; left:112px; top:220px; width:1080px; color:var(--s);">
      Private By<br>Design
    </div>
    <div data-layer="decor" class="rule" style="position:absolute; left:114px; top:626px; background:var(--accent);"></div>
    <div data-layer="text" data-role="subtitle" style="position:absolute; left:114px; top:690px; width:960px; color:var(--muted-on-ink);">
      Your memories, yours alone
    </div>
    <div data-layer="decor" style="position:absolute; left:-220px; top:1120px; width:1320px; height:1320px;
         border-radius:50%; background: radial-gradient(circle, rgba(182,137,60,0.17), transparent 68%);"></div>
    <div data-layer="device" data-device data-pack="iphone_12_pro" data-pose="tilted-left"
         data-screen-fallback="#221F19"
         style="position:absolute; width:1500px; left:80px; top:1040px;
                filter: drop-shadow(0 0 90px rgba(182,137,60,0.28)) drop-shadow(0 60px 100px rgba(0,0,0,0.65))
                        drop-shadow(1px 0 0 rgba(245,241,238,0.08));"></div>
  </section>

  <!-- Panel 4 · From Notes To Book · finale, tilted-right, warm glow rings -->
  <section class="panel" data-panel="4"
       style="background: linear-gradient(200deg, var(--cream-hi) 0%, var(--s) 45%, var(--cream-lo) 100%);">
    <div data-layer="decor" style="position:absolute; right:-260px; bottom:-260px; width:780px; height:780px;
         border-radius:50%; border:50px solid rgba(182,137,60,0.16);"></div>
    <div data-layer="decor" style="position:absolute; right:-130px; bottom:-130px; width:520px; height:520px;
         border-radius:50%; border:38px solid rgba(182,137,60,0.24);"></div>
    <div data-layer="text" data-role="title" style="position:absolute; left:112px; top:190px; width:1090px; color:var(--p);">
      From Notes<br>To Book
    </div>
    <div data-layer="decor" class="rule" style="position:absolute; left:114px; top:596px;"></div>
    <div data-layer="text" data-role="subtitle" style="position:absolute; left:114px; top:722px; width:960px; color:var(--muted-on-cream);">
      Let AI write your biography
    </div>
    <div data-layer="device" data-device data-pack="iphone_12_pro" data-pose="tilted-right"
         data-screenshot="/datasource/screenshots/appstore_iphone_portrait/ai.PNG.png"
         data-screen-fallback="#EDE6DA"
         class="shadow-lg"
         style="position:absolute; width:1300px; left:10px; top:1300px;
                filter: drop-shadow(0 0 130px rgba(182,137,60,0.22)) drop-shadow(0 55px 85px rgba(12,12,10,0.32));"></div>
  </section>

</div>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>appstore-iphone-portrait</title>
<style>
  html, body { margin: 0; }
  .strip { display: flex; gap: 0; width: max-content; background: #2b2b2b; }
  .panel {
    position: relative; overflow: hidden;
    width: 1290px; height: 2796px;
    background: #f5f1ee;
  }
  [data-role="title"] {
    font-family: Georgia, 'Times New Roman', serif; font-weight: 700;
    font-size: 128px; line-height: 1.08; letter-spacing: -1px; color: #0c0c0a;
  }
  [data-role="subtitle"] {
    font-family: -apple-system, 'Helvetica Neue', system-ui, sans-serif;
    font-size: 56px; line-height: 1.3; color: #57534e;
  }
  [data-role="caption"] {
    font-family: -apple-system, 'Helvetica Neue', system-ui, sans-serif;
    font-size: 38px; line-height: 1.4; color: #6b655b;
  }

  .glow {
    border-radius: 50%; filter: blur(120px);
  }
  .ring {
    border-radius: 50%; border-style: solid;
  }
</style>
<script type="module" src="/composer/device-frames.mjs"></script>
</head>
<body>
<div class="strip">

  <section class="panel" data-panel="0">
    <div data-layer="decor" class="glow"
         style="position:absolute; width:1400px; height:1400px; right:-500px; top:-300px; background:#c79a56; opacity:0.16;"></div>
    <div data-layer="decor" class="ring"
         style="position:absolute; width:1700px; height:1700px; right:-450px; top:1150px; border-width:2px; border-color:#c79a56; opacity:0.35;"></div>

    <div data-layer="text" data-role="title"
         style="position:absolute; left:95px; top:230px; width:1120px;">Capture Your<br>Story</div>
    <div data-layer="text" data-role="subtitle"
         style="position:absolute; left:95px; top:560px; width:980px;">Every moment worth remembering</div>

    <div data-layer="device" data-device data-pack="iphone_12_pro" data-pose="front"
         data-screenshot="/strips/appstore-iphone-portrait/screenshots/management.PNG.png"
         data-screen-fallback="#0c0c0a"
         style="position:absolute; left:170px; bottom:-210px; width:1060px; filter:drop-shadow(0 60px 90px rgba(12,12,10,0.28));"></div>
  </section>

  <section class="panel" data-panel="1">
    <div data-layer="decor" class="glow"
         style="position:absolute; width:1300px; height:1300px; left:-450px; bottom:-350px; background:#c79a56; opacity:0.14;"></div>

    <div data-layer="text" data-role="title"
         style="position:absolute; left:95px; top:200px; width:1050px;">Write in<br>Seconds</div>
    <div data-layer="text" data-role="subtitle"
         style="position:absolute; left:95px; top:530px; width:980px;">Quick notes, zero friction</div>

    <div data-layer="device" data-device data-pack="iphone_12_pro" data-pose="isometric-left"
         data-screenshot="/strips/appstore-iphone-portrait/screenshots/form.jpeg"
         data-screen-fallback="#0c0c0a"
         style="position:absolute; left:150px; bottom:-360px; width:1460px; filter:drop-shadow(0 70px 100px rgba(12,12,10,0.3));"></div>
  </section>

  <section class="panel" data-panel="2">
    <div data-layer="decor" class="glow"
         style="position:absolute; width:1300px; height:1300px; right:-450px; bottom:-350px; background:#c79a56; opacity:0.14;"></div>

    <div data-layer="text" data-role="title"
         style="position:absolute; right:95px; top:200px; width:1050px; text-align:right;">Just Speak It</div>
    <div data-layer="text" data-role="subtitle"
         style="position:absolute; right:95px; top:400px; width:980px; text-align:right;">Voice notes on the go</div>

    <div data-layer="device" data-device data-pack="iphone_12_pro" data-pose="isometric-right"
         data-screenshot="/strips/appstore-iphone-portrait/screenshots/recording.PNG.png"
         data-screen-fallback="#0c0c0a"
         style="position:absolute; right:-320px; bottom:-360px; width:1460px; filter:drop-shadow(0 70px 100px rgba(12,12,10,0.3));"></div>
  </section>

  <section class="panel" data-panel="3" style="background:#0c0c0a;">
    <div data-layer="decor" class="glow"
         style="position:absolute; width:1500px; height:1500px; left:-500px; top:-400px; background:#c79a56; opacity:0.10;"></div>
    <div data-layer="decor" class="ring"
         style="position:absolute; width:900px; height:900px; left:195px; top:900px; border-width:2px; border-color:#c79a56; opacity:0.4;"></div>
    <div data-layer="decor"
         style="position:absolute; left:340px; top:1130px; width:610px; height:610px; border-radius:50%;
                background:radial-gradient(circle at 35% 30%, #262420, #0c0c0a 70%);
                box-shadow: inset 0 0 0 2px rgba(199,154,86,0.45);"></div>
    <svg data-layer="decor" viewBox="0 0 100 100"
         style="position:absolute; left:530px; top:1320px; width:250px; height:250px;">
      <path d="M50 20 a18 18 0 0 0 -18 18 v10 h-4 a4 4 0 0 0 -4 4 v26 a4 4 0 0 0 4 4 h44 a4 4 0 0 0 4 -4 v-26 a4 4 0 0 0 -4 -4 h-4 v-10 a18 18 0 0 0 -18 -18 z m0 8 a10 10 0 0 1 10 10 v10 h-20 v-10 a10 10 0 0 1 10 -10 z"
            fill="#c79a56"></path>
    </svg>

    <div data-layer="text" data-role="title"
         style="position:absolute; left:95px; top:250px; width:1100px; color:#f5f1ee;">Private By<br>Design</div>
    <div data-layer="text" data-role="subtitle"
         style="position:absolute; left:95px; top:580px; width:960px; color:#a39a8c;">Your memories, yours alone</div>
  </section>

  <section class="panel" data-panel="4">
    <div data-layer="decor" class="glow"
         style="position:absolute; width:1500px; height:1500px; left:-350px; top:-350px; background:#c79a56; opacity:0.20;"></div>
    <div data-layer="decor" class="glow"
         style="position:absolute; width:1000px; height:1000px; right:-300px; bottom:100px; background:#c79a56; opacity:0.12;"></div>

    <div data-layer="text" data-role="title"
         style="position:absolute; left:95px; top:190px; width:1130px;">From Notes<br>To Book</div>
    <div data-layer="text" data-role="subtitle"
         style="position:absolute; left:95px; top:520px; width:1000px;">Let AI write your biography</div>

    <div data-layer="device" data-device data-pack="iphone_12_pro" data-pose="tilted-right"
         data-screenshot="/strips/appstore-iphone-portrait/screenshots/ai.PNG.png"
         data-screen-fallback="#0c0c0a"
         style="position:absolute; right:-260px; bottom:-260px; width:1400px; filter:drop-shadow(0 70px 100px rgba(12,12,10,0.32));"></div>
  </section>

</div>
</body>
</html>
